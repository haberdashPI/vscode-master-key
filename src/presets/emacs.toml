# author: David Little
# license: MIT https://github.com/haberdashPI/vscode-master-key/blob/main/LICENSE.md

## # Emacs Keybindings

## This preset provides a modest set of Emacs keybindings for Master Key, covering
## the essential editing, navigation, selection, window management, search, and buffer
## manipulation features of Emacs.
##
## Emacs uses modeless text insertion with a transient mark (`ctrl+space`), rich cursor and
## structural navigation (`ctrl+f/b/n/p`, `alt+f/b`, `ctrl+a/e`, `alt+a/e`, `alt+{/}`, `ctrl+alt+f/b`),
## universal argument prefixing (`ctrl+u`, `alt+0`..`alt+9`), kill-ring editing (`ctrl+w`, `alt+w`,
## `ctrl+y`, `alt+y`, `ctrl+k`), incremental search (`ctrl+s`, `ctrl+r`), and standard `ctrl+x`, `ctrl+c`,
## and `ctrl+h` command prefixes.
##
## Contributions to improve the keybindings are welcome and can be submitted via a
## [PR](https://github.com/haberdashPI/vscode-master-key/pulls)

# NOTE: this file is used to generate both keybindings and to generate a markdown file that
# documents the bindings. When comments are prefixed `##` they are included in the final
# markdown output. All other comments will be ignored.

[header]
name = "Emacs"
version = "2.2.0"
requiredExtensions = [
    "haberdashPI.selection-utilities",
    "haberdashPI.vscode-select-by-indent",
    "pustelto.bracketeer",
    "wmaurer.change-case",
    "dnut.rewrap-revived",
]

[[kind]]
name = "motion"
description = "These commands move the cursor and/or modify selections."

[[kind]]
name = "action"
description = "Actions do something with text (e.g. killing, yanking, changing case, formatting)."

[[kind]]
name = "search"
description = "Incremental search and replace commands."

[[kind]]
name = "util"
description = "Utility commands like help, modes, files, buffers, windows, and macros."

[[mode]]
name = "emacs"
default = true
cursorShape = "Line"
whenNoBinding = "insertCharacters"

## Users can change what key is used for emacs `M-` by setting `meta` in `[[define.val]]`.
## (e.g. using `source = "Emacs"` in their own custom bindings). For example:
##
## ```toml
## [header]
## version = "2.2.0"
## source = "Emacs"
##
## [[define.val]]
## # use the window key for bindings with `M-` in emacs
## meta = "win"
## ```
[[define.val]]
meta = "alt"

[[define.val]]
mark = false

# =============================================================================
## ## Motion Templates
# =============================================================================

[[define.bind]]
id = "cursor_motion"
command = "cursorMove"
args.value = '{{max(key.count, 1)}}'
args.select = '{{val.mark}}'

[[define.bind]]
id = "object_motion"
command = "selection-utilities.moveBy"
args.value = '{{max(key.count, 1)}}'
args.select = '{{val.mark}}'

# =============================================================================
## ## Cancellation & Help
# =============================================================================

## `ctrl+g` (`keyboard-quit`) is the universal cancel command in Emacs. It cancels ongoing
## selections, deactivates mark, closes open widgets, and resets any pending prefixes
## or count arguments.

[[bind]]
key = "ctrl+g"
prefixes.any = true
command = "runCommands"
args.commands = [
    "cancelSelection",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]
doc.kind = "util"
doc.name = "quit"
doc.description = "cancel command / deactivate mark / dismiss widgets"
doc.combined.name = "quit / cancel"
doc.combined.key = "ctrl+g / Esc"
doc.combined.description = "cancel command / deactivate mark / dismiss widgets"

[[bind]]
foreach.key = ["escape", "ctrl+["]
key = "{{key}}"
prefixes.any = true
command = "runCommands"
args.commands = [
    "cancelSelection",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]
doc.kind = "util"
doc.name = "escape"
doc.description = "escape / cancel selection"
doc.combined.name = "quit / cancel"

## ### Getting Help (`ctrl+h`)
##
## Emacs provides extensive contextual help through the `ctrl+h` prefix.

[[bind]]
foreach.key = ["ctrl+h b", "ctrl+h t"]
key = '{{key}}'
doc.kind = "util"
doc.name = "describe bindings"
doc.description = "Show text documentation for keybindings"
command = "master-key.showTextDoc"

[[bind]]
foreach.key = ["ctrl+h ctrl+v", "ctrl+h ctrl+t", "ctrl+h ctrl+b"]
key = '{{key}}'
doc.kind = "util"
doc.name = "visual doc"
priority = -1
doc.description = "Show visual documentation for keybindings"
command = "master-key.showVisualDoc"

[[bind]]
key = "ctrl+h a"
doc.kind = "util"
doc.name = "apropos command"
doc.description = "Search all available commands"
command = "workbench.action.showCommands"

[[bind]]
key = "ctrl+h v"
doc.kind = "util"
doc.name = "describe variable"
doc.description = "Open settings editor"
command = "workbench.action.openSettings"

[[bind]]
key = "ctrl+h ctrl+q"
doc.kind = "util"
doc.name = "suggest"
finalKey = false
doc.description = """
Show all command suggestions."""
command = "master-key.toggleSuggestions"

[[bind]]
key = "ctrl+h"
doc.kind = "util"
doc.name = "suggest"
finalKey = false
prefixes.allBut = ["", "ctrl+h"]
doc.description = """
Show command suggestions within the context of the current mode and keybinding prefix.
"""
command = "master-key.toggleSuggestions"

[[bind]]
key = "ctrl+{{val.meta}}+;"
doc.kind = "util"
doc.name = "suggest"
finalKey = false
doc.description = """
Show command suggestions.
"""
command = "master-key.toggleSuggestions"

# =============================================================================
## ## Mark & Region Management
# =============================================================================

## The region in Emacs is defined between point (cursor) and mark. Pressing `ctrl+space`
## sets the mark variable (`val.mark = true`), causing subsequent cursor motions to extend
## the selected region. `ctrl+x ctrl+x` exchanges point and mark.

[[bind]]
foreach.key = ["ctrl+space", "ctrl+shift+2"]
key = "{{key}}"
when = "!master-key.val.mark"
doc.kind = "util"
doc.name = "set mark"
doc.description = "Set mark at point and start selecting"
doc.combined.name = "set mark"
doc.combined.key = "ctrl+space / ctrl+shift+2"
doc.combined.description = "Set mark at point and start selecting"
command = "master-key.setValue"
args.name = "mark"
args.value = true

[[bind]]
foreach.key = ["ctrl+space", "ctrl+shift+2"]
key = "{{key}}"
when = "master-key.val.mark"
doc.kind = "util"
doc.name = "deactivate mark"
doc.description = "Deactivate mark and cancel selection"
doc.combined.name = "set mark"
command = "runCommands"
args.commands = [
    "cancelSelection",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

[[bind]]
key = "ctrl+x ctrl+x"
doc.kind = "motion"
doc.name = "exchange point & mark"
doc.description = "Exchange cursor position with mark anchor"
command = "runCommands"
args.commands = [
    "selection-utilities.exchangeAnchorActive",
    { command = "master-key.setValue", args = { name = "mark", value = true } },
]

[[bind]]
key = "ctrl+x h"
doc.kind = "action"
doc.name = "mark whole buffer"
doc.description = "Select entire buffer"
command = "runCommands"
args.commands = [
    "editor.action.selectAll",
    { command = "master-key.setValue", args = { name = "mark", value = true } },
]

[[bind]]
key = "{{val.meta}}+h"
doc.kind = "action"
doc.name = "mark paragraph"
doc.description = "Select current paragraph"
command = "runCommands"
args.commands = [
    { command = "selection-utilities.moveBy", args = { unit = "paragraph", boundary = "both", selectWhole = true } },
    { command = "master-key.setValue", args = { name = "mark", value = true } },
]

[[bind]]
foreach.key = ["ctrl+{{val.meta}}+space", "ctrl+{{val.meta}}+shift+2"]
key = "{{key}}"
doc.kind = "action"
doc.name = "mark sexp"
doc.description = "Select balanced expression or bracketed block"
doc.combined.name = "mark sexp"
doc.combined.key = "ctrl+{{val.meta}}+space / ctrl+{{val.meta}}+shift+2"
doc.combined.description = "Select balanced expression or bracketed block"
command = "runCommands"
args.commands = [
    "pustelto.bracketeer.selectQuotesAndBrackets",
    { command = "master-key.setValue", args = { name = "mark", value = true } },
]

[[bind]]
key = "ctrl+{{val.meta}}+h"
doc.kind = "action"
doc.name = "mark defun"
doc.description = "Select surrounding function or block"
command = "runCommands"
args.commands = [
    "haberdashPI.vscode-select-by-indent.select-outer-indent",
    { command = "master-key.setValue", args = { name = "mark", value = true } },
]

# =============================================================================
## ## Cursor Movement
# =============================================================================

## Standard Emacs cursor movements operate character-by-character, line-by-line,
## and word-by-word. When mark is active, each motion extends the region.

# -- Character & Line Motions (ctrl+f, ctrl+b, ctrl+n, ctrl+p) --

# ctrl+f (Forward char)
[[bind]]
default = "{{bind.cursor_motion}}"
key = "ctrl+f"
tags = ["motion"]
doc.kind = "motion"
args.to = "right"
doc.name = "char →"
doc.description = "move cursor forward one character"
doc.combined.name = "char →/←"
doc.combined.key = "ctrl+f/ctrl+b"
doc.combined.description = "move cursor forward/backward one character"

# ctrl+b (Backward char)
[[bind]]
default = "{{bind.cursor_motion}}"
key = "ctrl+b"
tags = ["motion"]
doc.kind = "motion"
args.to = "left"
doc.name = "char ←"
doc.description = "move cursor backward one character"
doc.combined.name = "char →/←"

# ctrl+n (Next line)
[[bind]]
default = "{{bind.cursor_motion}}"
key = "ctrl+n"
tags = ["motion"]
doc.kind = "motion"
args.to = "down"
args.by = "wrappedLine"
doc.name = "line ↓"
doc.description = "move cursor to next line"
doc.combined.name = "line ↓/↑"
doc.combined.key = "ctrl+n/ctrl+p"
doc.combined.description = "move cursor down/up one line"

# ctrl+p (Previous line)
[[bind]]
default = "{{bind.cursor_motion}}"
key = "ctrl+p"
tags = ["motion"]
doc.kind = "motion"
args.to = "up"
args.by = "wrappedLine"
doc.name = "line ↑"
doc.description = "move cursor to previous line"
doc.combined.name = "line ↓/↑"

# -- Line Boundary Motions (ctrl+a, ctrl+e, {{val.meta}}+m) --

# ctrl+a (Beginning of line)
[[bind]]
key = "ctrl+a"
when = "!master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorLineStart"
doc.name = "line start"
doc.description = "move cursor to beginning of line"
doc.combined.name = "line start/end"
doc.combined.key = "ctrl+a/ctrl+e"
doc.combined.description = "move cursor to beginning/end of line"

[[bind]]
key = "ctrl+a"
when = "master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorLineStartSelect"
doc.name = "line start"
doc.description = "select to beginning of line"
doc.combined.name = "line start/end"

# ctrl+e (End of line)
[[bind]]
key = "ctrl+e"
when = "!master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorLineEnd"
doc.name = "line end"
doc.description = "move cursor to end of line"
doc.combined.name = "line start/end"

[[bind]]
key = "ctrl+e"
when = "master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorLineEndSelect"
doc.name = "line end"
doc.description = "select to end of line"
doc.combined.name = "line start/end"

# {{val.meta}}+m (Back to indentation)
[[bind]]
key = "{{val.meta}}+m"
when = "!master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorHome"
doc.name = "first non-blank"
doc.description = "move cursor to first non-blank character of line"

[[bind]]
key = "{{val.meta}}+m"
when = "master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorHomeSelect"
doc.name = "first non-blank"
doc.description = "select to first non-blank character of line"

# -- Word Motions ({{val.meta}}+f, {{val.meta}}+b) --

# {{val.meta}}+f (Forward word)
[[bind]]
default = "{{bind.object_motion}}"
key = "{{val.meta}}+f"
tags = ["motion"]
doc.kind = "motion"
args.unit = "subword"
args.boundary = "end"
doc.name = "word →"
doc.description = "move forward to end of word"
doc.combined.name = "word →/←"
doc.combined.key = "{{val.meta}}+f/{{val.meta}}+b"
doc.combined.description = "move forward/backward by word"

# {{val.meta}}+b (Backward word)
[[bind]]
default = "{{bind.object_motion}}"
key = "{{val.meta}}+b"
tags = ["motion"]
doc.kind = "motion"
args.unit = "subword"
args.boundary = "start"
args.value = '{{-max(key.count, 1)}}'
doc.name = "word ←"
doc.description = "move backward to start of word"
doc.combined.name = "word →/←"

# -- Sentence & Paragraph Motions ({{val.meta}}+a, {{val.meta}}+e, {{val.meta}}+{, {{val.meta}}+}) --

# {{val.meta}}+a (Backward sentence)
[[bind]]
default = "{{bind.object_motion}}"
key = "{{val.meta}}+a"
tags = ["motion"]
doc.kind = "motion"
args.unit = "sentence"
args.boundary = "start"
args.value = '{{-max(key.count, 1)}}'
doc.name = "sentence ←"
doc.description = "move backward to start of sentence"
doc.combined.name = "sentence ←/→"
doc.combined.key = "{{val.meta}}+a/{{val.meta}}+e"
doc.combined.description = "move backward/forward by sentence"

# {{val.meta}}+e (Forward sentence)
[[bind]]
default = "{{bind.object_motion}}"
key = "{{val.meta}}+e"
tags = ["motion"]
doc.kind = "motion"
args.unit = "sentence"
args.boundary = "end"
doc.name = "sentence →"
doc.description = "move forward to end of sentence"
doc.combined.name = "sentence ←/→"

# {{val.meta}}+{ (Backward paragraph)
[[bind]]
key = "{{val.meta}}+shift+["
default = "{{bind.object_motion}}"
tags = ["motion"]
doc.kind = "motion"
args.unit = "paragraph"
args.boundary = "start"
args.value = '{{-max(key.count, 1)}}'
doc.name = "paragraph ←"
doc.description = "move backward to start of paragraph"
doc.combined.name = "paragraph ←/→"
doc.combined.key = "{{val.meta}}+{ / {{val.meta}}+}"
doc.combined.description = "move backward/forward by paragraph"

# {{val.meta}}+} (Forward paragraph)
[[bind]]
key = "{{val.meta}}+shift+]"
default = "{{bind.object_motion}}"
tags = ["motion"]
doc.kind = "motion"
args.unit = "paragraph"
args.boundary = "start"
doc.name = "paragraph →"
doc.description = "move forward to start of next paragraph"
doc.combined.name = "paragraph ←/→"

# -- Buffer & Paging Motions ({{val.meta}}+<, {{val.meta}}+>, ctrl+v, {{val.meta}}+v, ctrl+l) --

# {{val.meta}}+< (Beginning of buffer)
[[bind]]
key = "{{val.meta}}+shift+,"
when = "!master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorTop"
doc.name = "buffer start"
doc.description = "move cursor to beginning of buffer"
doc.combined.name = "buffer start/end"
doc.combined.key = "{{val.meta}}+< / {{val.meta}}+>"
doc.combined.description = "move cursor to beginning/end of buffer"

[[bind]]
key = "{{val.meta}}+shift+,"
when = "master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorTopSelect"
doc.name = "buffer start"
doc.description = "select to beginning of buffer"
doc.combined.name = "buffer start/end"

# {{val.meta}}+> (End of buffer)
[[bind]]
key = "{{val.meta}}+shift+."
when = "!master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorBottom"
doc.name = "buffer end"
doc.description = "move cursor to end of buffer"
doc.combined.name = "buffer start/end"

[[bind]]
key = "{{val.meta}}+shift+."
when = "master-key.val.mark"
tags = ["motion"]
doc.kind = "motion"
command = "cursorBottomSelect"
doc.name = "buffer end"
doc.description = "select to end of buffer"
doc.combined.name = "buffer start/end"

# ctrl+v (Scroll page down)
[[bind]]
key = "ctrl+v"
tags = ["motion"]
doc.kind = "motion"
doc.name = "page ↓"
doc.description = "scroll page down (scroll-up-command)"
doc.combined.name = "page ↓/↑"
doc.combined.key = "ctrl+v/{{val.meta}}+v"
doc.combined.description = "scroll page down/up"
command = "selection-utilities.activePageMove"
args.dir = "down"
args.value = '{{max(key.count, 1)}}'
args.select = '{{val.mark}}'

# {{val.meta}}+v (Scroll page up)
[[bind]]
key = "{{val.meta}}+v"
tags = ["motion"]
doc.kind = "motion"
doc.name = "page ↑"
doc.description = "scroll page up (scroll-down-command)"
doc.combined.name = "page ↓/↑"
command = "selection-utilities.activePageMove"
args.dir = "up"
args.value = '{{max(key.count, 1)}}'
args.select = '{{val.mark}}'

# ctrl+l (Recenter)
[[bind]]
key = "ctrl+l"
tags = ["motion"]
doc.kind = "motion"
doc.name = "recenter"
doc.description = "recenter window around cursor (recenter-top-bottom)"
command = "selection-utilities.revealActive"
args.at = "center"

# -- Goto Line & Error Navigation ({{val.meta}}+g g, {{val.meta}}+g n, {{val.meta}}+g p) --

[[bind]]
foreach.key = ["{{val.meta}}+g g", "{{val.meta}}+g {{val.meta}}+g"]
key = "{{key}}"
doc.kind = "motion"
doc.name = "goto line"
doc.description = "Go to line number"
doc.combined.name = "goto line"
doc.combined.key = "{{val.meta}}+g g"
doc.combined.description = "Go to line number"
command = "workbench.action.gotoLine"

[[bind]]
foreach.key = ["{{val.meta}}+g n", "{{val.meta}}+g {{val.meta}}+n"]
key = "{{key}}"
doc.kind = "motion"
doc.name = "next error"
doc.description = "Navigate to next error or diagnostic"
doc.combined.name = "next/prev error"
doc.combined.key = "{{val.meta}}+g n / {{val.meta}}+g p"
doc.combined.description = "Navigate to next/previous error or diagnostic"
command = "editor.action.marker.next"

[[bind]]
foreach.key = ["{{val.meta}}+g p", "{{val.meta}}+g {{val.meta}}+p"]
key = "{{key}}"
doc.kind = "motion"
doc.name = "prev error"
doc.description = "Navigate to previous error or diagnostic"
doc.combined.name = "next/prev error"
command = "editor.action.marker.prev"

# =============================================================================
## ## Structural / shift+Expression Navigation (Paredit)
# =============================================================================

## Structural motions allow jumping across balanced parentheses, brackets, and
## language expressions.

# ctrl+{{val.meta}}+f (Forward sexp)
[[bind]]
key = "ctrl+{{val.meta}}+f"
tags = ["motion"]
doc.kind = "motion"
doc.name = "sexp →"
doc.description = "move forward across balanced expression (forward-sexp)"
doc.combined.name = "sexp →/←"
doc.combined.key = "ctrl+{{val.meta}}+f/ctrl+{{val.meta}}+b"
doc.combined.description = "move forward/backward across balanced expression"
command = "pustelto.bracketeer.jumpToMatching"

# ctrl+{{val.meta}}+b (Backward sexp)
[[bind]]
key = "ctrl+{{val.meta}}+b"
tags = ["motion"]
doc.kind = "motion"
doc.name = "sexp ←"
doc.description = "move backward across balanced expression (backward-sexp)"
doc.combined.name = "sexp →/←"
command = "pustelto.bracketeer.jumpToMatching"

# ctrl+{{val.meta}}+u (Backward up list)
[[bind]]
key = "ctrl+{{val.meta}}+u"
tags = ["motion"]
doc.kind = "motion"
doc.name = "up list"
doc.description = "move up and out of current bracketed structure (backward-up-list)"
command = "editor.action.smartSelect.expand"

# ctrl+{{val.meta}}+d (Down list)
[[bind]]
key = "ctrl+{{val.meta}}+d"
tags = ["motion"]
doc.kind = "motion"
doc.name = "down list"
doc.description = "move down and into next bracketed structure (down-list)"
command = "editor.action.smartSelect.shrink"

# ctrl+{{val.meta}}+k (Kill sexp)
[[bind]]
key = "ctrl+{{val.meta}}+k"
tags = ["action"]
doc.kind = "action"
doc.name = "kill sexp"
doc.description = "kill forward balanced expression (kill-sexp)"
command = "runCommands"
args.commands = [
    "editor.action.smartSelect.expand",
    "editor.action.clipboardCutAction",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

# =============================================================================
## ## Killing & Yanking (Cut, Copy, Paste)
# =============================================================================

## Text killed in Emacs is placed in the kill-ring (system clipboard). `ctrl+w` kills
## the active region, `{{val.meta}}+w` copies it without killing, `ctrl+y` yanks (pastes), and
## `ctrl+k` kills from point to end of line.

# TODO: I'm not convinced of the semantics of ctrl+w, I need to remind myself how that works
# in Emacs

# ctrl+w (Kill region / Cut)
[[bind]]
key = "ctrl+w"
tags = ["action"]
doc.kind = "action"
doc.name = "kill region"
doc.description = "kill (cut) text in region"
command = "runCommands"
args.commands = [
    "editor.action.clipboardCutAction",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

# (Kill ring save / Copy)
[[bind]]
key = "{{val.meta}}+w"
tags = ["action"]
doc.kind = "action"
doc.name = "copy region"
doc.description = "copy region to kill ring without deleting (kill-ring-save)"
command = "runCommands"
args.commands = [
    "editor.action.clipboardCopyAction",
    "selection-utilities.shrinkToActive",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

# (Yank / Paste)
[[bind]]
key = "ctrl+y"
tags = ["action"]
doc.kind = "action"
doc.name = "yank"
doc.description = "yank (paste) most recent kill from kill ring"
command = "runCommands"
args.commands = [
    "killring.pastePop",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

## TODO: use better kill ring and accept that UX is different
## (update debug settings)
# (Yank pop / Clipboard cycle)
[[bind]]
key = "{{val.meta}}+y"
tags = ["action"]
doc.kind = "action"
doc.name = "yank pop"
doc.description = "replace just-yanked text with previous kill from ring"
command = "killring.pastePopNext"

# (Show Kill-ring)
[[bind]]
key = "ctrl+{{val.meta}}+y"
tags = ["action"]
doc.kind = "action"
doc.name = "show yanks"
doc.description = "show the clipboard history"
command = "killring.showRing"

# ctrl+k (Kill line)
[[bind]]
key = "ctrl+k"
tags = ["action"]
doc.kind = "action"
doc.name = "kill line"
doc.description = "kill from cursor to end of line, or kill newline if at end"
command = "runCommands"
args.commands = [
    { command = "cursorMove", args = { to = "wrappedLineEnd", select = true } },
    "editor.action.clipboardCutAction",
    { command = "master-key.setValue", args = { name = "mark", value = false } },
]

# ctrl+shift+backspace (Kill whole line)
[[bind]]
key = "ctrl+shift+backspace"
tags = ["action"]
doc.kind = "action"
doc.name = "kill whole line"
doc.description = "kill entire line including newline"
command = "editor.action.deleteLines"

# ctrl+d (Delete char forward)
[[bind]]
key = "ctrl+d"
tags = ["action"]
doc.kind = "action"
doc.name = "delete char"
doc.description = "delete character forward without adding to kill ring"
command = "deleteRight"

# {{val.meta}}+d (Kill word forward)
[[bind]]
key = "{{val.meta}}+d"
tags = ["action"]
doc.kind = "action"

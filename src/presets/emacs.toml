# =============================================================================
## ## Prefix Arguments & Counts (C-u, M-0..9)
# =============================================================================

## Prefix arguments repeat commands a specified number of times. `C-u` supplies a
## default multiplier of 4, while `M-0` through `M-9` supply exact numeric counts.

# C-u (Universal argument)
[[bind]]
key = "ctrl+u"
command = "master-key.updateCount"
finalKey = false
args.value = 4
doc.kind = "util"
doc.name = "universal argument"
doc.description = "Universal argument prefix (default 4x count multiplier)"

# M-0 .. M-9 (Digit arguments)
[[bind]]
foreach.num = ['{{keys(`[0-9]`)}}']
key = "alt+{{num}}"
command = "master-key.updateCount"
finalKey = false
args.value = "{{num}}"
doc.kind = "util"
doc.name = "digit {{num}}"
doc.description = "Add digit {{num}} to prefix argument count"
doc.combined.key = "M-0-9"
doc.combined.name = "digit 0-9"
doc.combined.description = "Add digit 0-9 to prefix argument count"


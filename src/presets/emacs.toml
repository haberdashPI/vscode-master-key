command = "git.viewHistory"

# =============================================================================
## ## Commands & Shell Execution (`{{val.meta}}+x`, `{{val.meta}}+!`)
# =============================================================================

## Execute extended commands by name and launch terminal / shell commands.

# {{val.meta}}+x (Execute extended command)
[[bind]]
key = "{{val.meta}}+x"
doc.kind = "util"
doc.name = "execute command"
doc.description = "Open command palette (execute-extended-command)"
command = "workbench.action.showCommands"

# {{val.meta}}+! (Shell command)
[[bind]]
key = "{{val.meta}}+shift+1"
doc.kind = "util"
doc.name = "shell command"
doc.description = "Toggle integrated terminal (shell-command)"
doc.combined.name = "shell command"
doc.combined.key = "{{val.meta}}+!"
doc.combined.description = "Toggle integrated terminal"
command = "workbench.action.terminal.toggleTerminal"

# =============================================================================
## ## Keyboard Macros (`ctrl+x (`, `ctrl+x )`, `ctrl+x e`)
# =============================================================================

## Record and replay sequences of key commands.

# ctrl+x ( (Start macro)
[[bind]]
key = "ctrl+x shift+9"
doc.kind = "util"
doc.name = "start macro"
doc.description = "Start recording key sequence (kmacro-start-macro)"
doc.combined.name = "macro record / call"
doc.combined.key = "ctrl+x ( / ctrl+x ) / ctrl+x e"
doc.combined.description = "Start, stop, and replay recorded keyboard macro"
command = "master-key.record"

# ctrl+x ) (End macro)
[[bind]]
key = "ctrl+x shift+0"
doc.kind = "util"
doc.name = "end macro"
doc.description = "Stop recording key sequence (kmacro-end-macro)"
doc.combined.name = "macro record / call"
command = "noop"

# ctrl+x e (Call last macro)
[[bind]]
key = "ctrl+x e"
doc.kind = "util"
doc.name = "call macro"
doc.description = "Replay most recently recorded macro (kmacro-end-and-call-macro)"
doc.combined.name = "macro record / call"
command = "master-key.replayFromStack"
repeat = '{{max(key.count, 1)}}'

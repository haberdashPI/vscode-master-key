# =============================================================================
## ## Prefix Arguments & Counts (ctrl+u, {{val.meta}}+0..9)
# =============================================================================

## Prefix arguments repeat commands a specified number of times. `ctrl+u` supplies a
## default multiplier of 4, while `{{val.meta}}+0` through `{{val.meta}}+9` supply exact numeric counts.

# ctrl+u (Universal argument)
[[bind]]
key = "ctrl+u"
command = "master-key.updateCount"
finalKey = false
args.value = 4
doc.kind = "util"
doc.name = "universal argument"
doc.description = "Universal argument prefix (default 4x count multiplier)"

# {{val.meta}}+0 .. {{val.meta}}+9 (Digit arguments)
[[bind]]
foreach.num = ['{{keys(`[0-9]`)}}']
key = "{{val.meta}}+{{num}}"
command = "master-key.updateCount"
finalKey = false
args.value = "{{num}}"
doc.kind = "util"
doc.name = "digit {{num}}"
doc.description = "Add digit {{num}} to prefix argument count"
doc.combined.key = "{{val.meta}}+0-9"
doc.combined.name = "digit 0-9"
doc.combined.description = "Add digit 0-9 to prefix argument count"

